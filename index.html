<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div class="score-holder">
                <h3>HOME</h3>
                <div class="display", id="hscore"> </div>
                <div class="btn-holder">
                    <button onclick="homeOne()">+1</button>
                    <button onclick="homeTwo()">+2</button>
                    <button onclick="homeThree()">+3</button>
                </div>
            </div>
            <div class="score-holder">
                <h3>AWAY</h3>
                <div class="display", id="gscore"> </div>
                <div class="btn-holder">
                    <button onclick="guestOne()">+1</button>
                    <button onclick="guestTwo()">+2</button>
                    <button onclick="guestThree()">+3</button>
                </div>
            </div>
        </div>
         <div class="new-game">
            <button onclick="newGame()">NEW GAME!</button>
        </div>
        <div class="leader">
            <button onclick="leader()">LEADING TEAM?</button>
            <span id="lead"></span>
        </div>
        <script src="index.js"></script>
    </body>
</html>
